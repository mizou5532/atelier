name: Publier Atelier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publier-atelier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: da2ceaef0348ded5fcb80261e724dcfa
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Vérifier le secret Cloudflare
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "Secret CLOUDFLARE_API_TOKEN manquant"; exit 1; }
      - run: npm ci
      - name: Tests et vérification des types
        run: npm test && npm run typecheck
      - name: Signet Time Travel avant les migrations (retour en arrière possible 30 jours)
        run: npx wrangler d1 time-travel info atelier
      - name: Migrations de la base
        run: npx wrangler d1 migrations apply atelier --remote
      - name: Construire et publier
        run: npm run build && npx wrangler deploy
